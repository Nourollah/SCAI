includes:
  - configs/DeepSet/metrics_and_losses.yml
  - configs/DeepSet/dataset.yml

logger: wandb


model:
  name: deepset
  embedding_dim: 128
  hidden_channels: 128
  num_filters: 128
  num_rbf: 128
  using_experts: True
  expert_head_mode: "stack"
  transform_depth: 1
  cutoff: 6.0
  use_pbc: True
  otf_graph: True

optim:
  optimizer: Adam
  lr_initial: 0.0005
  lr_gamma: 0.1
  lr_milestones: # steps at which lr_initial <- lr_initial * lr_gamma
    - 7812
    - 12500
    - 15625
  warmup_steps: 4687
  warmup_factor: 0.2

  batch_size:                   8         # 6
  eval_batch_size:              8         # 6
  #  load_balancing: atoms # It must be commented for loading data without references.
  num_workers: 8
  max_epochs: 50
  eval_every: 1000

  scheduler: LambdaLR
  scheduler_params:
    lambda_type: cosine
    warmup_factor: 0.0
    warmup_epochs: 0.01
    lr_min_factor: 0.01         #
